<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>ERP 介面設計工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Microsoft YaHei','微軟正黑體','Arial',sans-serif;font-size:12px;}
html{height:100%;}
body{height:100vh;overflow:hidden;background:#d4d0c8;color:#000;display:flex;flex-direction:column;}

/* ── Top bar ── */
#topbar{
  height:28px;flex-shrink:0;
  background:linear-gradient(to right,#000080 0%,#1060c8 100%);
  color:#fff;display:flex;align-items:center;padding:0 6px;gap:4px;
}
.tb-title{font-weight:bold;font-size:13px;flex:1;letter-spacing:1px;}
.tb-sep{width:1px;height:18px;background:rgba(255,255,255,.3);}
.tb-btn{
  background:#d4d0c8;border:1px solid;border-color:#fff #808080 #808080 #fff;
  padding:0 10px;cursor:pointer;height:22px;color:#000;font-size:11px;font-family:inherit;
}
.tb-btn:hover{background:#dedad4;}
.tb-btn:active{border-color:#808080 #fff #fff #808080;}
.tb-btn.primary{background:#4060a0;color:#fff;border-color:#8090d0 #203070 #203070 #8090d0;}
.tb-btn.primary:hover{background:#4d6db5;}

/* ── Mod bar ── */
#modbar{
  height:26px;flex-shrink:0;background:#d4d0c8;
  border-bottom:2px solid #808080;box-shadow:inset 0 1px 0 #fff;
  display:flex;align-items:center;padding:0 6px;gap:8px;
}
.mb-lbl{color:#000080;font-weight:bold;font-size:11px;}
.mb-sel{
  height:20px;border:1px solid;border-color:#808080 #fff #fff #808080;
  background:#fff;padding:0 4px;font-family:inherit;
}
#mb-info{margin-left:auto;font-size:11px;color:#555;}

/* ── Main ── */
#main{display:flex;flex:1;overflow:hidden;min-height:0;}

/* ── Left panel ── */
#left{width:52%;display:flex;flex-direction:column;border-right:2px solid #808080;overflow:hidden;background:#f0f0ec;}

/* ── Right panel ── */
#right{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#e8e8e4;}

/* ── Panel header ── */
.ph{
  height:22px;flex-shrink:0;background:#d4d0c8;border-bottom:1px solid #808080;
  padding:0 6px;display:flex;align-items:center;gap:6px;
  font-weight:bold;color:#000080;font-size:11px;box-shadow:inset 0 1px 0 #fff;
}
.ph-actions{margin-left:auto;display:flex;gap:3px;}
.ph-btn{
  background:#d4d0c8;border:1px solid;border-color:#fff #808080 #808080 #fff;
  padding:0 6px;cursor:pointer;height:18px;font-size:10px;font-family:inherit;
}
.ph-btn:hover{background:#dedad4;}

/* ── Section tabs ── */
.stabs{
  display:flex;background:#c8c5be;padding:2px 4px 0;gap:2px;flex-shrink:0;
  border-bottom:2px solid #808080;
}
.stab{
  padding:1px 12px;border:1px solid #808080;border-bottom:none;cursor:pointer;
  background:#a8a4a0;border-radius:3px 3px 0 0;margin-bottom:-2px;color:#333;font-size:11px;
}
.stab.active{background:#f0f0ec;font-weight:bold;border-bottom:2px solid #f0f0ec;z-index:1;color:#000;}
.stab:hover:not(.active){background:#b8b5ae;}

/* ── Column legend ── */
#legend{
  font-size:10px;color:#666;padding:1px 4px 2px;background:#e4e0dc;
  border-bottom:1px solid #d0ccc4;flex-shrink:0;display:flex;align-items:center;gap:3px;
}

/* ── Field list scroll area ── */
#flist{flex:1;min-height:0;overflow-y:auto;padding:3px;}

/* ── Field row ── */
.fr{
  display:flex;align-items:center;gap:3px;padding:1px 3px;margin-bottom:1px;
  background:#fff;border:1px solid #d8d4d0;
}
.fr:hover{background:#eef4ff;border-color:#8090c8;}
.fr.fr-hid{opacity:.45;background:#f8f8f8;}
.fr.drag-src{opacity:.35;}
.fr.drag-tgt{border-top:2px solid #0040cc;}

/* drag handle */
.dh{
  width:14px;height:20px;cursor:grab;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#b8b4b0;font-size:13px;user-select:none;
}
.dh:active{cursor:grabbing;}

/* visible checkbox */
.fr-vis{width:14px;height:14px;cursor:pointer;flex-shrink:0;}

/* label input */
.fr-lbl-wrap{flex:0 0 76px;}
.fr-lbl{width:100%;height:18px;border:1px solid;border-color:#a0a0a0 #e0e0e0 #e0e0e0 #a0a0a0;background:#fff;padding:0 2px;font-family:inherit;font-size:11px;}
.fr-lbl:focus{outline:none;background:#ffffc0;border-color:#0000aa;}
.fr-lbl:disabled{background:#f0f0f0;color:#888;}

/* key */
.fr-key{flex:0 0 86px;font-size:10px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* span / width controls */
.fr-span{flex:0 0 44px;display:flex;align-items:center;gap:1px;}
.fr-span label,.fr-wid label,.fr-aln label{font-size:10px;color:#888;}
.fr-span select,.fr-aln select{border:1px solid #a0a0a0;background:#fff;font-family:inherit;}
.fr-span select{width:30px;height:18px;}
.fr-wid{flex:0 0 54px;display:flex;align-items:center;gap:1px;}
.fr-wid input{width:38px;height:18px;border:1px solid #a0a0a0;background:#fff;padding:0 2px;}
.fr-aln{flex:0 0 44px;display:flex;align-items:center;gap:1px;}
.fr-aln select{width:32px;height:18px;}

/* badges */
.bd{padding:0 3px;height:15px;line-height:15px;border-radius:2px;font-size:9px;flex-shrink:0;white-space:nowrap;}
.bd-req{background:#ffe0e0;color:#cc0000;border:1px solid #ffbbbb;}
.bd-ro {background:#e8e8e8;color:#666;   border:1px solid #c8c8c8;}
.bd-sel{background:#fff0d8;color:#b05000;border:1px solid #ffd090;}
.bd-dim{background:#d8f0d8;color:#005000;border:1px solid #90d090;}
.bd-num{background:#e0eeff;color:#003090;border:1px solid #90b8ff;}
.bd-dt {background:#f0ffe0;color:#005000;border:1px solid #90d060;}
.bd-txt{background:#f8f8f8;color:#555;   border:1px solid #d8d8d8;}

/* delete button */
.fr-del{
  width:16px;height:16px;background:#d4d0c8;border:1px solid;
  border-color:#fff #808080 #808080 #fff;cursor:pointer;
  color:#800000;font-size:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  margin-left:auto;
}
.fr-del:hover{background:#ffd0d0;border-color:#cc0000;color:#cc0000;}

/* ── Add bar ── */
#addbar{
  border-top:2px solid #808080;background:#dedad4;padding:3px 4px;
  flex-shrink:0;display:flex;gap:3px;align-items:center;
}
.add-lbl{color:#000080;font-weight:bold;font-size:11px;white-space:nowrap;}
.add-inp{height:20px;border:1px solid;border-color:#808080 #fff #fff #808080;background:#fff;padding:0 4px;font-family:inherit;}
.add-btn{background:#d4d0c8;border:1px solid;border-color:#fff #808080 #808080 #fff;padding:0 8px;height:20px;cursor:pointer;font-family:inherit;font-size:11px;}
.add-btn:hover{background:#dedad4;}

/* ── Preview tabs ── */
.ptabs{display:flex;background:#c8c5be;padding:2px 4px 0;gap:2px;flex-shrink:0;border-bottom:2px solid #808080;}
.ptab{padding:1px 12px;border:1px solid #808080;border-bottom:none;cursor:pointer;background:#a8a4a0;border-radius:3px 3px 0 0;margin-bottom:-2px;color:#333;font-size:11px;}
.ptab.active{background:#e8e8e4;font-weight:bold;border-bottom:2px solid #e8e8e4;z-index:1;color:#000;}
.ptab:hover:not(.active){background:#b8b5ae;}

/* ── Preview scroll ── */
#pscroll{flex:1;min-height:0;overflow:auto;padding:6px 8px;}
#pscroll .ph-note{font-size:11px;color:#888;padding:4px 2px;margin-top:4px;}

/* ── Form preview ── */
.pf{
  display:grid;column-gap:6px;row-gap:3px;padding:4px 8px;
  background:#f0f0f0;border:1px solid #a0a0a0;
  border-top:2px solid #808080;border-left:2px solid #808080;
}
.pf-fc{display:flex;align-items:center;gap:2px;overflow:hidden;min-width:0;}
.pf-lbl{color:#000080;font-weight:bold;white-space:nowrap;font-size:11px;flex-shrink:0;}
.pf-lbl.req{color:#cc0000;}
.pf-inp{
  flex:1;height:17px;background:#fff;font-size:11px;min-width:0;
  border:1px solid;border-color:#808080 #dfdfdf #dfdfdf #808080;padding:0 2px;
}
.pf-inp.ro{background:#f0f0f0;color:#666;}
.pf-div{font-size:10px;color:#888;flex-shrink:0;}

/* ── Grid preview ── */
.pg-wrap{border:1px solid #808080;overflow:auto;max-height:400px;}
.pg{border-collapse:collapse;min-width:100%;}
.pg th{
  background:#d4d0c8;border:1px solid #808080;padding:1px 6px;
  white-space:nowrap;color:#000080;font-weight:bold;font-size:11px;
  position:sticky;top:0;z-index:2;
}
.pg td{border-right:1px solid #d0d0d0;border-bottom:1px solid #d0d0d0;height:17px;padding:0 4px;background:#fffff0;font-size:11px;color:#555;white-space:nowrap;}
.pg tr:hover td{background:#ddeeff;}

/* ── Status bar ── */
#sbar{
  height:20px;flex-shrink:0;background:#d4d0c8;border-top:2px solid #808080;
  padding:0 8px;display:flex;align-items:center;box-shadow:inset 0 1px 0 #fff;
}
#sbar-msg{font-size:11px;color:#000080;flex:1;}
#sbar-cnt{font-size:11px;color:#555;}

/* scrollbar */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:#e0dcd4;}
::-webkit-scrollbar-thumb{background:#b0aca4;border:1px solid #888;}
.empty{color:#888;padding:16px;text-align:center;font-style:italic;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span style="font-size:14px;">🔧</span>
  <span class="tb-title">ERP 介面設計工具</span>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="importJSON()" title="匯入 JSON 設定">⬆ 匯入</button>
  <button class="tb-btn" onclick="exportJSON()" title="匯出 JSON 設定">⬇ 匯出</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="resetDefault()" title="還原預設欄位">↺ 還原預設</button>
  <button class="tb-btn primary" onclick="saveConfig()">💾 儲存設定</button>
</div>

<!-- MODULE BAR -->
<div id="modbar">
  <span class="mb-lbl">模組：</span>
  <select class="mb-sel" id="mod-sel" onchange="switchMod(this.value)">
    <option value="庫存主檔">庫存主檔</option>
    <option value="倉庫存量">倉庫存量</option>
  </select>
  <span class="mb-lbl" style="margin-left:12px;">表單欄數：</span>
  <select class="mb-sel" id="cols-sel" onchange="setCols(+this.value)">
    <option value="4">4 欄</option>
    <option value="5">5 欄</option>
    <option value="6" selected>6 欄</option>
    <option value="8">8 欄</option>
  </select>
  <span id="mb-info"></span>
</div>

<!-- MAIN -->
<div id="main">

  <!-- LEFT: FIELD CONFIG -->
  <div id="left">
    <div class="ph">
      ⚙ 欄位設定
      <div class="ph-actions">
        <button class="ph-btn" onclick="allVis(true)"  title="全部顯示">👁 全顯</button>
        <button class="ph-btn" onclick="allVis(false)" title="全部隱藏">👁 全隱</button>
        <button class="ph-btn" onclick="sortFields()"  title="依鍵值排序">↕ 排序</button>
      </div>
    </div>
    <div class="stabs">
      <div class="stab active" id="stab-form" onclick="switchSec('form')">表單欄位</div>
      <div class="stab" id="stab-grid" onclick="switchSec('grid')">格子欄位</div>
    </div>
    <div id="legend"></div>
    <div id="flist"></div>
    <div id="addbar">
      <span class="add-lbl">＋ 新增：</span>
      <input class="add-inp" id="add-key"   placeholder="欄位鍵值" style="width:90px;">
      <input class="add-inp" id="add-label" placeholder="顯示名稱" style="width:76px;">
      <select class="add-inp" id="add-type" style="width:66px;height:20px;">
        <option value="text">文字</option>
        <option value="number">數字</option>
        <option value="select">下拉</option>
        <option value="date">日期</option>
        <option value="dim">尺寸</option>
      </select>
      <button class="add-btn" onclick="addField()">新增</button>
    </div>
  </div>

  <!-- RIGHT: PREVIEW -->
  <div id="right">
    <div class="ph">👁 即時預覽</div>
    <div class="ptabs">
      <div class="ptab active" id="ptab-form" onclick="switchPrev('form')">表單預覽</div>
      <div class="ptab" id="ptab-grid" onclick="switchPrev('grid')">格子預覽</div>
    </div>
    <div id="pscroll"></div>
  </div>

</div>

<!-- STATUS BAR -->
<div id="sbar">
  <span id="sbar-msg">就緒</span>
  <span id="sbar-cnt"></span>
</div>

  '異動日期':'114年11月12日','預設倉號':'A1',
  '庫存控管':'Y','批號控管':'Y','備註':'—',
  '顏色':'','漆種':'','管厚':'','鍍層':'','抗拉強度':'',
  '倉庫屬性':'本倉','倉庫編號':'A1','數量':'9765','總數':'—',
  '金額':'','銷貨品名':'鍍鋅捲板',
};

// ======================================================
//  STATE
// ======================================================
let cfg  = JSON.parse(JSON.stringify(DEFAULTS));
let cMod = '庫存主檔';
let cSec = 'form';   // 'form' | 'grid'
let cPrev= 'form';   // preview tab
let dragI = -1;

// ======================================================
//  INIT
// ======================================================
(function init() {
  const saved = localStorage.getItem('erp_designer_v2');
  if (saved) {
    try {
      const p = JSON.parse(saved);
      // merge: add any missing modules from defaults
      Object.keys(DEFAULTS).forEach(m => { if (!p[m]) p[m] = JSON.parse(JSON.stringify(DEFAULTS[m])); });
      cfg = p;
      setMsg('已載入上次儲存的設定');
    } catch(e) { /* use defaults */ }
  }
  document.getElementById('cols-sel').value = String(cfg[cMod].cols || 6);
  renderList();
  renderPreview();
  updateCount();
})();

// ======================================================
//  SWITCHING
// ======================================================
function switchMod(m) {
  cMod = m;
  document.getElementById('cols-sel').value = String(cfg[m].cols || 6);
  renderList(); renderPreview(); updateCount();
}
function switchSec(s) {
  cSec = s;
  ['form','grid'].forEach(x => document.getElementById('stab-'+x).classList.toggle('active', x===s));
  renderList();
}
function switchPrev(s) {
  cPrev = s;
  ['form','grid'].forEach(x => document.getElementById('ptab-'+x).classList.toggle('active', x===s));
  renderPreview();
}
function setCols(n) {
  cfg[cMod].cols = n;
  renderPreview();
  setMsg('表單欄數設為 '+n+' 欄');
}

// ======================================================
//  RENDER FIELD LIST
// ======================================================
function renderList() {
  // legend
  const leg = document.getElementById('legend');
  if (cSec === 'form') {
    leg.innerHTML = '<span style="width:14px"></span><span style="width:14px"></span>'
      +'<span style="flex:0 0 76px">顯示名稱</span>'
      +'<span style="flex:0 0 86px">欄位鍵值</span>'
      +'<span style="flex:0 0 44px">跨欄</span>'
      +'<span>型別／屬性</span>';
  } else {
    leg.innerHTML = '<span style="width:14px"></span><span style="width:14px"></span>'
      +'<span style="flex:0 0 76px">顯示名稱</span>'
      +'<span style="flex:0 0 86px">欄位鍵值</span>'
      +'<span style="flex:0 0 54px">寬度px</span>'
      +'<span style="flex:0 0 44px">對齊</span>'
      +'<span>型別</span>';
  }

  const fields = cfg[cMod][cSec];
  if (!fields || !fields.length) {
    document.getElementById('flist').innerHTML = '<div class="empty">無欄位，請新增</div>';
    return;
  }

  document.getElementById('flist').innerHTML = fields.map((f,i) => rowHTML(f,i)).join('');

  // attach drag events
  fields.forEach((_,i) => {
    const el = document.getElementById('fr-'+i);
    if (!el) return;
    el.setAttribute('draggable','true');
    el.addEventListener('dragstart', e => {
      dragI = i;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => el.classList.add('drag-src'), 0);
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('drag-src');
      document.querySelectorAll('.drag-tgt').forEach(x=>x.classList.remove('drag-tgt'));
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      document.querySelectorAll('.drag-tgt').forEach(x=>x.classList.remove('drag-tgt'));
      if (i !== dragI) el.classList.add('drag-tgt');
    });
    el.addEventListener('dragleave', () => el.classList.remove('drag-tgt'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('drag-tgt');
      if (dragI >= 0 && dragI !== i) {
        const arr = cfg[cMod][cSec];
        const [mv] = arr.splice(dragI, 1);
        arr.splice(i, 0, mv);
        dragI = -1;
        renderList(); renderPreview(); updateCount();
        setMsg('已移動「'+mv.label+'」至第 '+(i+1)+' 位');
      }
    });
  });
}

function rowHTML(f, i) {
  const hid = f.vis ? '' : ' fr-hid';
  // type badge
  const TB = { text:'<span class="bd bd-txt">文字</span>', number:'<span class="bd bd-num">數字</span>',
    select:'<span class="bd bd-sel">下拉</span>', date:'<span class="bd bd-dt">日期</span>',
    dim:'<span class="bd bd-dim">尺寸</span>' };
  const typeBd = TB[f.type] || TB.text;
  const reqBd  = f.req ? '<span class="bd bd-req">必填</span>' : '';
  const roBd   = f.ro  ? '<span class="bd bd-ro">唯讀</span>'  : '';

  let extra = '';
  if (cSec === 'form') {
    const opts = [1,2,3,4,5,6].map(v=>`<option value="${v}"${f.span===v?' selected':''}>${v}</option>`).join('');
    extra = `<div class="fr-span"><label>跨&nbsp;</label>
      <select onchange="setF(${i},'span',+this.value)" onclick="event.stopPropagation()">${opts}</select></div>`;
  } else {
    const alOpts = ['left','center','right'].map(a=>`<option value="${a}"${f.al===a?' selected':''}>${{left:'左',center:'中',right:'右'}[a]}</option>`).join('');
    extra = `<div class="fr-wid"><label>寬&nbsp;</label>
        <input type="number" min="20" max="500" value="${f.w||80}"
          onchange="setF(${i},'w',+this.value)" onclick="event.stopPropagation()"></div>
      <div class="fr-aln"><label>對&nbsp;</label>
        <select onchange="setF(${i},'al',this.value)" onclick="event.stopPropagation()">${alOpts}</select></div>`;
  }

  return `<div class="fr${hid}" id="fr-${i}">
    <div class="dh" title="拖曳排序">⠿</div>
    <input type="checkbox" class="fr-vis" ${f.vis?'checked':''} title="顯示/隱藏此欄位"
      onchange="toggleVis(${i})" onclick="event.stopPropagation()">
    <div class="fr-lbl-wrap">
      <input class="fr-lbl" type="text" value="${esc(f.label)}" ${!f.vis?'disabled':''}
        title="編輯顯示名稱" oninput="setF(${i},'label',this.value)">
    </div>
    <div class="fr-key" title="${esc(f.key)}">${esc(f.key)}</div>
    ${extra}
    ${typeBd}${reqBd}${roBd}
    <button class="fr-del" onclick="delField(${i})" title="刪除此欄位">✕</button>
  </div>`;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ======================================================
//  FIELD OPERATIONS
// ======================================================
function toggleVis(i) {
  const f = cfg[cMod][cSec][i];
  f.vis = !f.vis;
  const el = document.getElementById('fr-'+i);
  if (el) el.classList.toggle('fr-hid', !f.vis);
  // enable/disable label input
  const inp = el && el.querySelector('.fr-lbl');
  if (inp) inp.disabled = !f.vis;
  renderPreview(); updateCount();
}

function setF(i, prop, val) {
  cfg[cMod][cSec][i][prop] = val;
  renderPreview();
}

function delField(i) {
  const f = cfg[cMod][cSec][i];
  if (!confirm('確定刪除欄位「'+f.label+'」('+f.key+') ？')) return;
  cfg[cMod][cSec].splice(i,1);
  renderList(); renderPreview(); updateCount();
  setMsg('已刪除「'+f.label+'」');
}

function addField() {
  const key   = document.getElementById('add-key').value.trim();
  const label = document.getElementById('add-label').value.trim() || key;
  const type  = document.getElementById('add-type').value;
  if (!key) { alert('請填入欄位鍵值'); return; }

  const nf = cSec === 'form'
    ? { key, label, vis:true, span:1, type, ro:false, req:false }
    : { key, label, vis:true, w:80, al:'left' };

  cfg[cMod][cSec].push(nf);
  document.getElementById('add-key').value = '';
  document.getElementById('add-label').value = '';
  renderList(); renderPreview(); updateCount();
  setMsg('已新增欄位「'+label+'」');
  document.getElementById('flist').scrollTop = 99999;
}

function allVis(v) {
  cfg[cMod][cSec].forEach(f => f.vis = v);
  renderList(); renderPreview(); updateCount();
  setMsg(v ? '已全部設為顯示' : '已全部設為隱藏');
}

function sortFields() {
  cfg[cMod][cSec].sort((a,b) => a.key.localeCompare(b.key,'zh-TW'));
  renderList(); renderPreview();
  setMsg('已依欄位鍵值排序');
}

// ======================================================
//  PREVIEW
// ======================================================
function renderPreview() {
  document.getElementById('pscroll').innerHTML =
    cPrev === 'form' ? buildFormPrev() : buildGridPrev();
}

function buildFormPrev() {
  const fields = cfg[cMod].form.filter(f => f.vis);
  const cols   = cfg[cMod].cols || 6;
  if (!fields.length) return '<div class="empty">無顯示欄位</div>';

  const cells = fields.map(f => {
    const span = Math.min(f.span||1, cols);
    const lbl  = `<span class="pf-lbl${f.req?' req':''}">${esc(f.label)}</span>`;
    let   inp  = '';
    if (f.type === 'dim') {
      inp = ['厚度','寬度','長度'].map((_, j) =>
        (j>0?'<span class="pf-div">×</span>':'')+
        `<input class="pf-inp" style="flex:1;min-width:30px;" value="${j===0?'0.500':j===1?'1219':'C'}" readonly>`
      ).join('');
    } else if (f.type === 'select') {
      inp = `<select class="pf-inp" style="flex:1;height:18px;"><option>${SAMPLES[f.key]||'—'}</option></select>`;
    } else {
      inp = `<input class="pf-inp${f.ro?' ro':''}" value="${esc(SAMPLES[f.key]||'')}" style="flex:1;" ${f.ro?'readonly':''}>`;
    }
    return `<div class="pf-fc" style="grid-column:span ${span}">${lbl}${inp}</div>`;
  }).join('');

  return `<div class="pf" style="grid-template-columns:repeat(${cols},1fr);grid-auto-rows:minmax(21px,auto);">${cells}</div>
  <p class="ph-note">↑ 表單預覽 | 版面 ${cols} 欄 × ${fields.length} 個顯示欄位</p>`;
}

function buildGridPrev() {
  const fields = cfg[cMod].grid.filter(f => f.vis);
  if (!fields.length) return '<div class="empty">無顯示欄位</div>';

  const ths = fields.map(f =>
    `<th style="min-width:${f.w||80}px;text-align:${f.al||'left'}">${esc(f.label)}</th>`).join('');

  const sampleRows = Array.from({length:3},(_,ri)=>{
    const tds = fields.map(f=>{
      const v = ri===0 ? (SAMPLES[f.key]||'') : ri===1 ? '—' : '';
      return `<td style="text-align:${f.al||'left'}">${esc(String(v))}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');

  return `<div class="pg-wrap"><table class="pg">
    <thead><tr>${ths}</tr></thead>
    <tbody>${sampleRows}</tbody>
  </table></div>
  <p class="ph-note">↑ 格子預覽 | ${fields.length} 個顯示欄位（示範 3 列資料）</p>`;
}

// ======================================================
//  SAVE / EXPORT / IMPORT / RESET
// ======================================================
function saveConfig() {
  localStorage.setItem('erp_designer_v2', JSON.stringify(cfg));
  setMsg('✅ 設定已儲存 (localStorage)');
}

function exportJSON() {
  const json = JSON.stringify(cfg, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download:'erp_ui_config.json'
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setMsg('✅ 已匯出 erp_ui_config.json');
}

function importJSON() {
  const inp = Object.assign(document.createElement('input'), {
    type:'file', accept:'.json'
  });
  inp.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const p = JSON.parse(ev.target.result);
        Object.keys(DEFAULTS).forEach(m => { if (!p[m]) p[m] = JSON.parse(JSON.stringify(DEFAULTS[m])); });
        cfg = p;
        renderList(); renderPreview(); updateCount();
        setMsg('✅ 已匯入 '+file.name);
      } catch(err) { alert('JSON 格式錯誤：'+err.message); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function resetDefault() {
  if (!confirm('確定還原所有模組為預設設定？')) return;
  cfg = JSON.parse(JSON.stringify(DEFAULTS));
  document.getElementById('cols-sel').value = String(cfg[cMod].cols || 6);
  renderList(); renderPreview(); updateCount();
  setMsg('已還原預設設定');
}

// ======================================================
//  STATUS
// ======================================================
function setMsg(m) { document.getElementById('sbar-msg').textContent = m; }

function updateCount() {
  const f = cfg[cMod];
  const fv = f.form.filter(x=>x.vis).length, ft = f.form.length;
  const gv = f.grid.filter(x=>x.vis).length, gt = f.grid.length;
  document.getElementById('sbar-cnt').textContent =
    `表單：${fv}/${ft} 顯示　｜　格子：${gv}/${gt} 顯示`;
}
</script>
</body>
</html>
